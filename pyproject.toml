[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-capitalgraph"
version = "1.0.0"
description = "Evidence-backed analysis of Fortune 500 AI adoption, investment, ownership, and strategic-motive signals."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jithu Vathiath Biju"}]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "networkx>=3.0",
  "matplotlib>=3.7",
]

[project.scripts]
ai-capitalgraph = "aicapitalgraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

