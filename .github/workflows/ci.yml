name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=src python -m pytest
      - run: PYTHONPATH=src python -m aicapitalgraph.cli analyse
      - run: git diff --exit-code -- results reports/generated_findings.md
